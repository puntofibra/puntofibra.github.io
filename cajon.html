<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrir cajon</title>
<style>
  :root{
    --bg:#0d0f14; --surface:#151821; --surface2:#1c2030; --border:#252b3b;
    --text:#d7dbe8; --muted:#6b7490; --green:#00ee76; --red:#ff5252; --gold:#ffd740;
    --mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .caja{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px 24px;text-align:center;width:100%;max-width:340px}
  .ico{font-size:40px;margin-bottom:12px}
  .msg{font-size:14px;line-height:1.5;min-height:42px;display:flex;align-items:center;justify-content:center}
  .ok{color:var(--green)} .err{color:var(--red)}
  .btn{margin-top:16px;width:100%;background:var(--surface2);color:var(--gold);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
  .btn:hover{background:rgba(255,215,64,.15);border-color:var(--gold)}
  .btn[hidden]{display:none}
</style>
</head>
<body>
  <div class="caja">
    <div class="ico">&#128181;</div>
    <div id="msg" class="msg">Un momento&hellip;</div>
    <button id="btn" class="btn" hidden>Elegir impresora y abrir</button>
  </div>

<script>
/* ============================================================
   ABRIR CAJON PORTAMONEDAS  -  WebUSB + ESC/POS
   Mismo camino que el TPV: WebUSB -> ESC p m t1 t2
   Parametros opcionales por URL:
     ?pin=0    -> pin 2 del RJ11 (por defecto).   ?pin=1 -> pin 5
     ?cerrar=0 -> no cerrar la ventana automaticamente
     ?solo=1   -> solo emparejar la impresora, sin abrir el cajon
   ============================================================ */
var Q      = new URLSearchParams(location.search);
var PIN    = Q.get('pin') === '1' ? 1 : 0;
var CERRAR = Q.get('cerrar') !== '0';
var SOLO   = Q.get('solo') === '1';   // solo emparejar, sin pulso al cajon

var USB = { dispositivo: null, interfaz: null, salida: null };
var $msg = document.getElementById('msg');
var $btn = document.getElementById('btn');

function avisar(texto, clase){
  $msg.textContent = texto;
  $msg.className = 'msg' + (clase ? ' ' + clase : '');
}

/* De todos los aparatos USB autorizados para esta web, quedarse solo con uno
   que sepa recibir datos (endpoint bulk OUT). Asi no se cuela una webcam u
   otro trasto que el navegador tenga tambien autorizado. */
function tieneSalida(d){
  return d.configurations.some(c => c.interfaces.some(i => i.alternates.some(
    a => a.endpoints.some(e => e.direction === 'out' && e.type === 'bulk'))));
}
function elegirImpresora(lista){
  return lista.find(d => d.vendorId === 0x1fc9 && tieneSalida(d)) ||
         lista.find(tieneSalida) || null;
}

async function prepararDispositivo(d){
  if (!d.opened) await d.open();
  if (d.configuration === null) await d.selectConfiguration(1);

  var iNum = null, ep = null;
  for (const cfg of d.configurations){
    for (const itf of cfg.interfaces){
      for (const alt of itf.alternates){
        const salida = alt.endpoints.find(e => e.direction === 'out' && e.type === 'bulk');
        if (salida && iNum === null){ iNum = itf.interfaceNumber; ep = salida.endpointNumber; }
      }
    }
  }
  if (iNum === null) throw new Error('No encuentro el endpoint de salida de la impresora.');

  var cogida = false;
  for (var intento = 0; intento < 4 && !cogida; intento++){
    try { await d.claimInterface(iNum); cogida = true; }
    catch (e){
      if (intento === 3) throw new Error('La impresora esta ocupada por otra ventana (cierra la pestana del TPV) o le falta el driver WinUSB de Zadig. Detalle: ' + e.message);
      await new Promise(function(r){ setTimeout(r, 400); });
    }
  }
  USB.dispositivo = d;
  USB.interfaz = iNum;
  USB.salida = ep;
}

async function pulsoCajon(){
  /* ESC p m t1 t2  ->  27 112 pin 25 250 */
  await USB.dispositivo.transferOut(USB.salida, new Uint8Array([27, 112, PIN, 25, 250]));
}

/* Soltar la impresora al acabar, para que el TPV o la caja puedan usarla. */
async function soltar(){
  var d = USB.dispositivo, i = USB.interfaz;
  USB = { dispositivo: null, interfaz: null, salida: null };
  if (!d) return;
  try { if (i !== null && i !== undefined) await d.releaseInterface(i); } catch (e){}
  try { await d.close(); } catch (e){}
}

async function abrir(pedir){
  if (!navigator.usb) throw new Error('Este navegador no soporta WebUSB. Usa Chrome o Edge.');

  var d = elegirImpresora(await navigator.usb.getDevices());

  if (!d){
    if (!pedir) return false;
    try { d = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x1fc9 }] }); }
    catch (e){ d = await navigator.usb.requestDevice({ filters: [] }); }
  }

  await prepararDispositivo(d);
  try { if (!SOLO) await pulsoCajon(); }
  finally { await soltar(); }
  return true;
}

async function intentar(pedir){
  try {
    var hecho = await abrir(pedir);
    if (!hecho){
      avisar('Elige la impresora una sola vez. Despues ya se hara solo.');
      $btn.hidden = false;
      return;
    }
    avisar(SOLO ? 'Impresora lista' : 'Cajon abierto', 'ok');
    $btn.hidden = true;
    if (CERRAR) setTimeout(function(){ window.close(); }, 900);
  } catch (e){
    avisar(e.message, 'err');
    $btn.hidden = false;
    $btn.textContent = 'Reintentar';
  }
}

$btn.addEventListener('click', function(){ intentar(true); });
window.addEventListener('load', function(){
  document.title = SOLO ? 'Conectar impresora' : 'Abrir cajon';
  avisar(SOLO ? 'Conectando con la impresora\u2026' : 'Abriendo cajon\u2026');
  if (SOLO) $btn.textContent = 'Elegir impresora';
  intentar(false);
});
</script>
</body>
</html>
