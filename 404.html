<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada</title>
<meta name="theme-color" content="#0E1B2A">
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#0E1B2A;color:#fff;
            font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .caja{min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:18px;text-align:center;padding:34px 24px}
  .marca{background:#fff;border-radius:16px;padding:14px 20px;
         box-shadow:0 12px 30px rgba(0,0,0,.45);display:inline-flex}
  .marca img{width:min(62vw,260px);height:auto;display:block}
  .num{font-size:4.2rem;font-weight:900;letter-spacing:6px;color:#3FA9F5;margin:6px 0 0;
       line-height:1;text-shadow:0 6px 22px rgba(0,0,0,.55)}
  h1{margin:0;font-size:1.08rem;font-weight:800;letter-spacing:1.4px;color:#3FA9F5;
     text-transform:uppercase;max-width:460px;line-height:1.4}
  p{margin:0;font-size:.96rem;line-height:1.6;opacity:.78;max-width:400px}
  .raya{width:64px;height:3px;border-radius:99px;background:#3FA9F5;opacity:.55}
  .botonera{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:6px}
  .boton{background:#E8412F;color:#fff;border:0;font-family:inherit;text-decoration:none;
         font-weight:800;padding:15px 32px;border-radius:12px;font-size:1rem;letter-spacing:.6px;
         cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .boton:active{transform:translateY(1px)}
  .flojo{background:transparent;color:#fff;opacity:.55;font-weight:600;font-size:.86rem;
         padding:8px 12px;border:0;cursor:pointer;text-decoration:underline;font-family:inherit}
  .pie{font-size:.8rem;opacity:.35;margin-top:12px;letter-spacing:.5px}
</style>
</head>
<body>
  <div class="caja">
    <div class="marca">
      <img src="https://puntofibra.github.io/logo.png" alt="Puntofibra"
           onerror="this.parentNode.style.display='none'">
    </div>
    <p class="num">404</p>
    <h1>Esta dirección no existe</h1>
    <div class="raya"></div>
    <p>La página que has intentado abrir no está aquí. Puede que el enlace
       lleve una letra de más, o de menos.</p>
    <p>Revisa la dirección y vuelve a intentarlo.</p>
    <div class="botonera">
      <a class="boton" href="https://puntofibra.github.io/">IR AL INICIO</a>
      <button class="flojo" onclick="history.back()">Volver atrás</button>
    </div>
    <p class="pie">puntofibra.github.io</p>
  </div>
</body>
</html>
